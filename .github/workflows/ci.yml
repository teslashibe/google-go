name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.25.13"
          - "1.26.6"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -coverprofile=coverage.out

      - name: Race test
        run: go test -race ./... -count=1

      - name: Install govulncheck
        if: matrix.go == '1.26.6'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Vulnerability scan
        if: matrix.go == '1.26.6'
        run: govulncheck ./...
